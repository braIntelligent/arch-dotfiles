; Polybar flotante, Tokyo Night. Arch Linux ARM en VMware (interfaz cableada, bspwm)
include-file = ~/.config/polybar/colors.ini


[bar/main]
width = 98%
offset-x = 1%
offset-y = 16
height = 68
radius = 24
dpi = 192

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 4
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "Hack Nerd Font:size=11;6"
font-1 = "Hack Nerd Font:size=14;8"

; modules-left = arch date ip vpn   (con reloj)
modules-left = arch ip vpn
modules-center = bspwm
modules-right = target cpu memory

cursor-click = pointer
enable-ipc = true
wm-restack = bspwm
override-redirect = true

[module/arch]
type = custom/text
label = "%{T2}%{T-}"
label-foreground = ${colors.blue}
label-padding-right = 1

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = false

label-focused = 
label-focused-foreground = ${colors.blue}
label-focused-padding = 1

label-occupied = 
label-occupied-foreground = ${colors.purple}
label-occupied-padding = 1

label-urgent = 
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

label-empty = 
label-empty-foreground = ${colors.dim}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 5
date = %H:%M
date-alt = %A %d de %B, %H:%M
format-prefix = "  "
format-prefix-foreground = ${colors.cyan}
label = %date%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.yellow}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛  "
format-prefix-foreground = ${colors.purple}
label = %percentage_used%%

[module/ip]
type = custom/script
exec = ~/.config/polybar/scripts/ip.sh
interval = 2

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/vpn.sh
interval = 2

[module/target]
type = custom/script
exec = ~/.config/polybar/scripts/target.sh
interval = 2

[settings]
screenchange-reload = true
pseudo-transparency = false
