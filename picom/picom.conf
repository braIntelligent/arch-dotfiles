# Basado en el picom.conf del curso, adaptado a picom actual
# (Arch Linux ARM en VMware Fusion, backend glx sobre SVGA3D)

##############################################################################
#                                  CORNERS                                   #
##############################################################################
corner-radius = 20;
rounded-corners-exclude = [
  "window_type = 'dock'",
  #"class_g = 'firefox'",
];

##############################################################################
#                                  SHADOWS                                   #
##############################################################################
shadow = true;
shadow-radius = 30;
shadow-opacity = 0.5;
shadow-offset-x = -30;
shadow-offset-y = -30;
shadow-exclude = [
  "class_g = 'firefox' && argb"
];

##############################################################################
#                                  FADING                                    #
##############################################################################
fading = false;
fade-in-step = 0.01;
fade-out-step = 0.01;

##############################################################################
#                                  OPACITY                                   #
##############################################################################
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
focus-exclude = [ "class_g = 'Cairo-clock'" ];
# opacity-rule = [ "98:class_g = 'Polybar'" ];

##############################################################################
#                                   BLUR                                     #
##############################################################################
blur-method = "dual_kawase";
blur-strength = 3;
blur-background = true;
#blur-background-exclude = [
#  "window_type = 'dock'",
#  "window_type = 'desktop'",
#  "_GTK_FRAME_EXTENTS@:c"
#];

##############################################################################
#                                  GENERAL                                   #
##############################################################################
backend = "glx";
vsync = false;

# Necesario en esta VM: sin esto picom deja de dibujar ventanas
use-damage = false;

mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

log-level = "warn";

wintypes:
{
  tooltip       = { fade = true; shadow = true; opacity = 0.8; full-shadow = true; };
  dnd           = { shadow = false; };
  dropdown_menu = { shadow = false; };
  popup_menu    = { shadow = false; };
  utility       = { shadow = false; };
  dock          = { shadow = false; };
};
