enable_audio_bell no

include color.ini

font_family Hack Nerd Font
font_size 13

disable_ligatures never

url_color #61afef

url_style curly

map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

cursor_shape beam
cursor_beam_thickness 1.8

mouse_hide_wait 3.0
detect_urls yes

repaint_delay 10
input_delay 3
sync_to_monitor yes

map ctrl+shift+z toggle_layout stack
tab_bar_style powerline

inactive_tab_background #e06c75
active_tab_background #98c379
inactive_tab_foreground #000000
tab_bar_margin_color black

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

background_opacity 0.95

shell zsh

# ----------------------------------------------------------------------------
# Atajos estilo tmux: primero Ctrl+b, se suelta, y despues la tecla
# ----------------------------------------------------------------------------
# "splits" permite dividir hacia el lado o hacia abajo; "stack" es el zoom
enabled_layouts splits,stack

# pestanas (las "ventanas" de tmux)
map ctrl+b>c new_tab_with_cwd
map ctrl+b>n next_tab
map ctrl+b>p previous_tab
map ctrl+b>w select_tab
map ctrl+b>, set_tab_title
map ctrl+b>1 goto_tab 1
map ctrl+b>2 goto_tab 2
map ctrl+b>3 goto_tab 3
map ctrl+b>4 goto_tab 4
map ctrl+b>5 goto_tab 5
map ctrl+b>6 goto_tab 6
map ctrl+b>7 goto_tab 7
map ctrl+b>8 goto_tab 8
map ctrl+b>9 goto_tab 9

# paneles: v divide hacia el lado, s hacia abajo (tambien % y " como en tmux)
map ctrl+b>v launch --location=vsplit --cwd=current
map ctrl+b>s launch --location=hsplit --cwd=current
map ctrl+b>% launch --location=vsplit --cwd=current
map ctrl+b>" launch --location=hsplit --cwd=current
map ctrl+b>h neighboring_window left
map ctrl+b>j neighboring_window down
map ctrl+b>k neighboring_window up
map ctrl+b>l neighboring_window right
map ctrl+b>left neighboring_window left
map ctrl+b>down neighboring_window down
map ctrl+b>up neighboring_window up
map ctrl+b>right neighboring_window right
map ctrl+b>o next_window
map ctrl+b>z toggle_layout stack
map ctrl+b>x close_window
map ctrl+b>q focus_visible_window

# tamano del panel: Ctrl+b y luego Shift + h j k l
map ctrl+b>shift+h resize_window narrower 3
map ctrl+b>shift+l resize_window wider 3
map ctrl+b>shift+k resize_window taller 3
map ctrl+b>shift+j resize_window shorter 3

# historial de la terminal en un paginador (el "modo copia" de tmux)
map ctrl+b>[ show_scrollback
# recargar esta configuracion
map ctrl+b>r load_config_file
# mandar un Ctrl+b de verdad al programa: Ctrl+b dos veces
map ctrl+b>ctrl+b send_text all \x02
