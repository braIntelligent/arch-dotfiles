# Bloqueo y apagado de pantalla por inactividad. Los tiempos van en segundos.
# Enchufado no suspende solo por tiempo (cortaria escaneos o descargas largas);
# a bateria si, a los 15 minutos. Tambien se suspende al cerrar la tapa, y antes
# de dormir se bloquea.

general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 5 minutos: bloquear
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5 minutos y medio: apagar la pantalla; vuelve al tocar una tecla o el trackpad
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 minutos: suspender, pero solo si esta a bateria
listener {
    timeout = 900
    on-timeout = grep -qx Discharging /sys/class/power_supply/*/status && systemctl suspend
}
