# Bloqueo de pantalla: el fondo elegido, desenfocado, con la hora y los colores del tema.
# Los colores ($bg, $fg, $accent...) vienen de hyprlock-colores.conf, que escribe
# set-theme.sh; el fondo es un enlace que mantiene aplicar-fondo.sh.
source = ~/.config/hypr/hyprlock-colores.conf
$font = Hack Nerd Font

general {
    hide_cursor = true
    # 1 = copiar la pantalla por CPU; el modo por GPU falla en VMware
    screencopy_mode = 1
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.cache/fondo-bloqueo
    color = $bg                 # si no hay fondo elegido
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = $fg
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/fecha.sh
    font_size = 20
    font_family = $font
    color = $accent
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.35)
    outer_color = $accent
    check_color = $green
    fail_color = $red
    font_color = $fg
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = Clave
    fail_text = $PAMFAIL
    position = 0, -60
    halign = center
    valign = center
}
