# Bloqueo de pantalla. Fondo de color solido: en VMware la opcion
# "path = screenshot" hace fallar a hyprlock (no puede copiar la pantalla).
$font = Hack Nerd Font

general {
    hide_cursor = true
    # 1 = copiar la pantalla por CPU; el modo por GPU falla en VMware
    screencopy_mode = 1
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(0a0a0f)
}

label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(c0caf5)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d de %B"
    font_size = 20
    font_family = $font
    color = rgb(7aa2f7)
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = rgb(7aa2f7)
    check_color = rgb(73daca)
    fail_color = rgb(f7768e)
    font_color = rgb(c0caf5)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = Clave
    fail_text = $PAMFAIL
    position = 0, -60
    halign = center
    valign = center
}
