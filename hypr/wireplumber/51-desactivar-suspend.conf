# Evita el chirrido/pop de los parlantes del MacBook (Asahi).
# Al quedar en silencio, PipeWire suspende el nodo ALSA y el amplificador
# tas2770 hace un ciclo de apagado/encendido que suena como un chirrido.
# Desactivar el suspend por inactividad mantiene el amp alimentado.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
