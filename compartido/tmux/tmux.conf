# tmux: sesiones que siguen vivas aunque se cierre la terminal.
#   tmux new -s nombre     crear una sesion          tmux ls       verlas
#   Ctrl+a  d              salir dejandola corriendo  tmux a -t nombre   volver
# El prefijo es Ctrl+a (y no Ctrl+b) porque Ctrl+b ya lo usa kitty para sus paneles.
# Las teclas despues del prefijo son las mismas que en kitty.
unbind C-b
set -g prefix C-a
bind C-a send-prefix            # Ctrl+a dos veces: un Ctrl+a real al programa

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"
setw -g mode-keys vi

# paneles: v hacia el lado, s hacia abajo, en la misma carpeta
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3
bind x kill-pane
bind r source-file ~/.config/tmux/tmux.conf \; display "configuracion recargada"

# barra de estado: usa los colores de la terminal, asi sigue el tema activo
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=blue,bold] #S  "
set -g status-left-length 30
set -g status-right "#[fg=brightblack]%H:%M "
setw -g window-status-format "#[fg=brightblack] #I #W "
setw -g window-status-current-format "#[fg=blue,bold] #I #W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=yellow"
