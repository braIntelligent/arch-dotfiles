# macOS (amnesia): incluye la config del repo y corrige lo que es solo-Linux.
include base.conf

# Override macOS: los sockets abstractos (unix:@) no existen en mac -> ruta real.
listen_on unix:/tmp/kitty-{kitty_pid}

# Letra más grande (override mac)
font_size 16

# Colores del tema activo (los escribe set-theme.sh; sobreescribe color.ini del repo)
include theme.conf

# Shell de login: así corre ~/.zprofile (path_helper + init de OrbStack) y aparece
# /usr/local/bin y ~/.orbstack/bin en el PATH (si no, kitty no encuentra 'orb').
shell /bin/zsh --login

# Solo el Option IZQUIERDO actúa como Meta (moverse por palabra); el DERECHO
# escribe los símbolos del teclado latino: \ (opt-der + '), |, @, #, etc.
macos_option_as_alt left

# Frosted en el terminal: translúcido + blur de fondo (macOS).
background_opacity 0.90
background_blur 40

# ======================================================================
# Atajos SIMPLES estilo macOS (sin formato tmux). Limpiamos todo y definimos.
# ======================================================================
clear_all_shortcuts yes

# Portapapeles
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Mover/borrar por palabra (Option izquierdo + flechas / backspace)
map alt+left      send_text all \x1bb
map alt+right     send_text all \x1bf
map alt+backspace send_text all \x1b\x7f

# Tamaño de letra
map cmd+plus  change_font_size all +1
map cmd+equal change_font_size all +1
map cmd+minus change_font_size all -1
map cmd+0     change_font_size all 0

# Splits (paneles dentro de la ventana)
map cmd+d           launch --location=vsplit --cwd=current
map cmd+shift+d     launch --location=hsplit --cwd=current
map cmd+w           close_window
map cmd+h           neighboring_window left
map cmd+j           neighboring_window down
map cmd+k           neighboring_window up
map cmd+l           neighboring_window right
map cmd+shift+enter toggle_layout stack

# Pestañas
map cmd+t       new_tab_with_cwd
map cmd+shift+t set_tab_title
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

# Ventana nueva / scrollback / recargar
map cmd+n       new_os_window_with_cwd
map cmd+f       show_scrollback
map cmd+shift+r load_config_file
